<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b0f14;color:#e6edf3;font-family:system-ui,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:100%;max-width:380px;background:#151b23;border:1px solid #2a3340;border-radius:16px;padding:22px}
h1{font-size:22px;margin:0 0 12px}
.tabs{display:flex;background:#0b0f14;border:1px solid #2a3340;border-radius:12px;padding:3px;gap:3px}
.tabs button{flex:1;margin:0;padding:10px;font-size:15px;background:transparent;color:#9da7b3;border-radius:9px}
.tabs button.on{background:#2f81f7;color:#fff}
label{display:block;font-size:14px;color:#9da7b3;margin:12px 0 4px}
input[type=text],input[type=tel]{width:100%;font-size:20px;padding:12px;border-radius:10px;border:1px solid #2a3340;background:#0b0f14;color:#fff}
#id{letter-spacing:3px;text-align:center}
.row{display:flex;gap:8px}.row>div:first-child{flex:1}.row>div:last-child{width:96px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px}
.chk input{width:20px;height:20px}
button{margin-top:16px;width:100%;font-size:18px;padding:13px;border:0;border-radius:10px;background:#2f81f7;color:#fff;font-weight:600}
.err{color:#ff7b72;font-size:14px;margin-top:10px;min-height:18px}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.recent span{background:#1c2430;border:1px solid #2a3340;border-radius:20px;padding:6px 12px;font-size:14px}
.help{font-size:13px;color:#9da7b3;line-height:1.5;margin-top:16px;border-top:1px solid #2a3340;padding-top:10px}
</style>
</head>
<body>
<div class="card">
  <h1>🖥️ Điều Khiển Máy</h1>
  <div class="tabs"><button id="tNet" class="on">🌐 Qua Internet</button><button id="tLan">📶 Cùng Wi-Fi</button></div>

  <div id="pNet">
    <label>ID máy tính</label>
    <input id="id" type="tel" placeholder="123 456 789" autocomplete="off">
    <div class="recent" id="rNet"></div>
  </div>
  <div id="pLan" style="display:none">
    <div class="row">
      <div><label>Địa chỉ IP máy tính</label><input id="ip" type="text" inputmode="decimal" placeholder="192.168.1.5" autocomplete="off"></div>
      <div><label>Cổng</label><input id="port" type="tel" value="8765"></div>
    </div>
    <div class="recent" id="rLan"></div>
  </div>

  <label>Mật khẩu</label>
  <input id="pw" type="tel" placeholder="Mật khẩu trên máy tính" autocomplete="off">
  <div class="chk"><input type="checkbox" id="remember"><label for="remember" style="margin:0;color:#e6edf3">Nhớ mật khẩu</label></div>
  <button id="go">Kết nối</button>
  <div class="err" id="err"></div>
  <div class="help">
    Mở <b>DieuKhienMay.exe</b> trên máy tính, cửa sổ sẽ hiện <b>ID</b>, <b>IP</b> và <b>mật khẩu</b>.<br>
    • <b>Qua Internet</b>: dùng ở bất cứ đâu (4G, Wi-Fi khác).<br>
    • <b>Cùng Wi-Fi</b>: nhanh và mượt hơn khi ở nhà.
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const ls = (k, v) => { try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } };
const getList = k => { try{ return JSON.parse(ls(k) || '[]'); }catch(e){ return []; } };
let mode = ls('mode') || 'net';
const fmtId = v => { const d = v.replace(/\D/g, '').slice(0, 9); return d.replace(/(\d{3})(?=\d)/g, '$1 '); };

function setMode(m){
  mode = m; ls('mode', m);
  $('#tNet').classList.toggle('on', m === 'net'); $('#tLan').classList.toggle('on', m === 'lan');
  $('#pNet').style.display = m === 'net' ? '' : 'none'; $('#pLan').style.display = m === 'lan' ? '' : 'none';
}
$('#tNet').onclick = () => setMode('net');
$('#tLan').onclick = () => setMode('lan');
$('#id').addEventListener('input', () => { $('#id').value = fmtId($('#id').value); });

function drawRecent(){
  for(const [box, key, input, f] of [['#rNet','recentNet','#id',fmtId], ['#rLan','recent','#ip',x => x]]){
    $(box).innerHTML = '';
    for(const v of getList(key)){
      const s = document.createElement('span'); s.textContent = f(v);
      s.onclick = () => $(input).value = f(v); $(box).appendChild(s);
    }
  }
}
$('#id').value = fmtId(ls('id') || '');
$('#ip').value = ls('ip') || ''; $('#port').value = ls('port') || '8765';
$('#remember').checked = ls('remember') === '1';
if($('#remember').checked) $('#pw').value = ls('pw') || '';
setMode(mode); drawRecent();
const err = new URLSearchParams(location.search).get('err');
if(err) $('#err').textContent = 'Không kết nối được (' + err + '). Kiểm tra máy tính đã mở chương trình chưa.';

function remember(listKey, val){
  ls(listKey, JSON.stringify([val, ...getList(listKey).filter(x => x !== val)].slice(0, 4)));
}

// Tra địa chỉ Internet hiện tại của máy tính theo ID
async function findUrl(id){
  const r = await fetch('https://ntfy.sh/dkm-v1-' + id + '/json?poll=1&since=12h', {cache:'no-store'});
  if(!r.ok) throw new Error('Không tra được ID (mạng có vấn đề?)');
  const lines = (await r.text()).trim().split('\n').filter(Boolean);
  let best = null;
  for(const l of lines){
    try{
      const m = JSON.parse(l); if(m.event !== 'message') continue;
      const d = JSON.parse(m.message);
      if(/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(d.url) && (!best || m.time >= best.time)) best = {url:d.url, time:m.time};
    }catch(e){}
  }
  if(!best) throw new Error('Không tìm thấy máy có ID này, hoặc máy tính chưa mở chương trình');
  return best.url;
}

$('#go').onclick = async () => {
  const pw = $('#pw').value.trim();
  ls('remember', $('#remember').checked ? '1' : '0'); ls('pw', $('#remember').checked ? pw : '');
  if(mode === 'net'){
    const id = $('#id').value.replace(/\D/g, '');
    if(id.length !== 9){ $('#err').textContent = 'ID gồm 9 chữ số'; return; }
    ls('id', id); remember('recentNet', id);
    $('#err').textContent = 'Đang tìm máy tính…';
    try{
      const url = await findUrl(id);
      $('#err').textContent = 'Đang kết nối…';
      location.href = url + '/#pw=' + encodeURIComponent(pw);
    }catch(e){ $('#err').textContent = e.message; }
  } else {
    const ip = $('#ip').value.trim(), port = $('#port').value.trim() || '8765';
    if(!/^[\w.\-]+$/.test(ip)){ $('#err').textContent = 'Nhập địa chỉ IP, ví dụ 192.168.1.5'; return; }
    ls('ip', ip); ls('port', port); remember('recent', ip);
    $('#err').textContent = 'Đang kết nối…';
    location.href = 'http://' + ip + ':' + port + '/#pw=' + encodeURIComponent(pw);
  }
};
</script>
</body>
</html>
