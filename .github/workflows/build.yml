name: Build APK va EXE
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DieuKhienMay-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow pyinstaller
      - name: Tai cloudflared
        working-directory: pc
        run: Invoke-WebRequest -Uri https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe
      - name: Build EXE
        working-directory: pc
        run: pyinstaller --onefile --name DieuKhienMay --add-data "web;web" --add-binary "cloudflared.exe;." server.py
      - uses: actions/upload-artifact@v4
        with:
          name: DieuKhienMay-PC
          path: pc/dist/DieuKhienMay.exe
